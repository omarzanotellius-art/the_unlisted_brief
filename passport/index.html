<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Fictional records of farms in a real county: not listed by search engines; links still followed. -->
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset passport · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  /* page surround */
  --bg:#F5F2EE; --text:#0F1E38; --muted:#4A5568; --panel:#FFFFFF; --line:rgba(15,30,56,0.18);
  --link:#7A5A40; --btn:#0F1E38; --btn-text:#FFFFFF; --chip:#FFFFFF; --chip-line:rgba(15,30,56,0.25);
  --banner-bg:#F4ECE6; --banner-line:#8C6A4F;
  /* the booklet is a physical object: its paper and ink stay the same in light and dark */
  --paper:#FBF8F3; --ink:#0F1E38; --ink-muted:#4A5568; --bronze:#7A5A40; --cover:#0F1E38; --gold:#D9BE8C;
  --serif:'Epilogue',Georgia,'Times New Roman',serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14171C; --text:#ECE7DF; --muted:#A8B0BC; --panel:#1C2027; --line:rgba(236,231,223,0.18);
    --link:#D9BE8C; --btn:#D9BE8C; --btn-text:#14171C; --chip:#1C2027; --chip-line:rgba(236,231,223,0.28);
    --banner-bg:#2A2420; --banner-line:#8C6A4F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14171C; --text:#ECE7DF; --muted:#A8B0BC; --panel:#1C2027; --line:rgba(236,231,223,0.18);
  --link:#D9BE8C; --btn:#D9BE8C; --btn-text:#14171C; --chip:#1C2027; --chip-line:rgba(236,231,223,0.28);
  --banner-bg:#2A2420; --banner-line:#8C6A4F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.wrap{max-width:1220px;margin:0 auto;padding:0 24px}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-top:28px}
.brand{font-family:var(--serif);font-weight:500;font-size:15px;color:var(--text);text-decoration:none}
.back{font-size:12px;color:var(--muted);text-decoration:none}
main{display:flex;flex-direction:column;gap:30px;padding:28px 0 64px}
.disclosure{border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.5;color:var(--muted);background:var(--panel)}
.archived{border:1px solid var(--banner-line);background:var(--banner-bg);border-radius:8px;padding:12px 16px;font-size:13px}
.head{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted)}
h1{margin:0;font-family:var(--serif);font-weight:300;font-size:34px;line-height:1.15;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px;font-size:12px;color:var(--muted)}
.meta .src{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.dot{width:8px;height:8px;border-radius:50%}
.linkbtn{background:none;border:0;padding:0 2px;min-height:44px;font:inherit;color:var(--link);text-decoration:underline;cursor:pointer}
.booklet{display:flex;flex-direction:column;align-items:center;gap:20px;padding:6px 0;border-radius:12px}
.spread{display:grid;grid-template-columns:440px 440px;border-radius:10px;box-shadow:0 18px 30px rgba(15,30,56,.18)}
.single-wrap{width:440px;border-radius:12px;box-shadow:0 18px 30px rgba(15,30,56,.22)}
.navrow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;width:100%;max-width:880px}
.btn{min-height:44px;min-width:44px;padding:0 18px;border-radius:8px;font-family:var(--sans);font-size:14px;cursor:pointer}
.btn.prev{border:1px solid var(--chip-line);background:var(--chip);color:var(--text)}
.btn.next{border:1px solid var(--btn);background:var(--btn);color:var(--btn-text)}
.btn[disabled]{opacity:.45;cursor:default}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:150px;text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px}
.tab{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--chip-line);background:var(--chip);color:var(--text);font-family:var(--sans);font-size:13px;cursor:pointer}
.tab[aria-current="page"]{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.jump{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--sans);font-size:12px;color:var(--muted)}
.jump select{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--chip-line);background:var(--chip);color:var(--text);font-family:var(--sans);font-size:13px;cursor:pointer;max-width:100%}
.row a.wl{color:inherit;text-decoration:none}
.row a.wl:hover{text-decoration:underline;text-underline-offset:3px}
.ext{display:inline-block;margin-left:4px;font-family:var(--sans);font-size:.95em;font-weight:500;color:var(--bronze);text-decoration:none}
.stamp .ext{font-size:.8em;margin-left:3px}
.years{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.years .lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);padding-right:4px}
.year{min-height:44px;min-width:44px;padding:0 10px;border-radius:8px;border:1px solid var(--chip-line);background:var(--chip);color:var(--text);font-family:var(--mono);font-size:12px;cursor:pointer}
.year[aria-current="page"]{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.cta{border-top:1px solid var(--line);padding-top:30px;display:flex;flex-direction:column;gap:10px}
.cta a.primary{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:10px 22px;border-radius:8px;background:var(--btn);color:var(--btn-text);text-decoration:none;font-size:15px;line-height:1.4}
.small{margin:0;font-size:12px;color:var(--muted)}
.closing{border-top:1px solid var(--line);padding-top:22px;display:flex;flex-direction:column;gap:8px;font-size:12px;line-height:1.6;color:var(--muted);max-width:760px}
.closing p{margin:0}
footer{text-align:center;padding:24px 24px 40px;font-family:var(--serif);font-size:12px;color:var(--muted)}

/* ---------- passport pages (fixed paper colours) ---------- */
.pg{width:440px;max-width:100%;min-width:0;aspect-ratio:440/620;display:flex;flex-direction:column;font-family:var(--sans);color:var(--ink)}
.pg>*{flex:1 1 auto;min-width:0}
.cover{background:var(--cover);border-radius:6px 16px 16px 6px;box-shadow:inset 12px 0 0 rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:56px 28px 44px;color:var(--gold);text-align:center}
.cover .cty{font-family:var(--serif);font-size:12px;letter-spacing:.22em}
.cover .ttl{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:.2em}
.cover .nm{font-size:14px;letter-spacing:.08em;margin-top:12px}
.backc{background:var(--cover);border-radius:16px 6px 6px 16px;box-shadow:inset -12px 0 0 rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:44px 28px;color:var(--gold);text-align:center}
.backc .a{font-family:var(--serif);font-size:11px;letter-spacing:.22em}
.backc .b{font-family:var(--mono);font-size:12px;letter-spacing:.1em}
.paper{background-color:var(--paper);border:1px solid rgba(15,30,56,.16);padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px}
.paper.guil{background-image:repeating-linear-gradient(135deg,rgba(15,30,56,.025) 0 2px,transparent 2px 9px);padding:24px 24px 20px;gap:16px}
.paper.lined{background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(15,30,56,.045) 27px 28px)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ph .t{font-family:var(--serif);font-size:13px;letter-spacing:.18em}
.ph .n{font-size:10px;letter-spacing:.1em;color:var(--ink-muted);white-space:nowrap}
.lab{font-size:9px;letter-spacing:.12em;color:var(--ink-muted)}
.val{font-size:13px;line-height:1.35}
.gt{font-size:9px;letter-spacing:.14em;color:var(--ink-muted);padding-bottom:4px}
.row{display:flex;flex-direction:column;gap:2px;padding:7px 0;border-bottom:1px dotted rgba(15,30,56,.25)}
.row .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 12px;font-size:13px}
.row .top .v{font-size:12px;color:var(--ink-muted)}
.row .s{font-size:11px;line-height:1.35;color:var(--ink-muted)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.summary div{background:rgba(15,30,56,.05);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.summary b{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.stamps{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:6px 0}
.stampcell{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}
.stamp{text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;max-width:100%;aspect-ratio:1/1;padding:12px;border-radius:50%;background:rgba(255,255,255,.35)}
.stamp .l{font-size:9px;letter-spacing:.14em;font-weight:600}
.stamp .d{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.04em}
.stamp .x{font-size:11px;line-height:1.3}
.stamp .b{font-size:8.5px;letter-spacing:.04em;line-height:1.25}
.note{font-size:11px;line-height:1.35;font-style:italic;color:var(--bronze)}
.notice{font-size:12px;color:var(--ink-muted);text-align:center}
.logrow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px dotted rgba(15,30,56,.25);text-decoration:none;color:var(--ink)}
.logrow .dt{font-family:var(--mono);font-size:12px;font-weight:700}
.logrow .rc{font-size:10px;line-height:1.3}
.logrow .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.logrow .ty{font-size:9px;letter-spacing:.14em;font-weight:600}
.logrow .tx{font-size:13px;line-height:1.35}
.logrow .eq{font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.logrow .by,.logrow .bf{font-size:11px;color:var(--ink-muted);line-height:1.35}
.empty{flex:1 1 auto;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-muted);text-align:center}
.mrz{margin-top:auto;min-width:0;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink);background:rgba(255,255,255,.7);border-radius:4px;padding:8px 10px;line-height:1.6;overflow:hidden;white-space:nowrap}
.dp-top{display:flex;gap:16px;flex-wrap:wrap;min-width:0}
.photo{width:92px;height:112px;flex:0 0 auto;border-radius:6px;background:#EDE7E0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-muted);font-size:11px}
.g2{flex:1 1 200px;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;align-content:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 12px}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.checks{display:flex;gap:16px;font-size:13px;padding-top:3px}
.checks span{display:inline-flex;align-items:center;gap:6px}
.box{width:15px;height:15px;border:1.5px solid var(--ink);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;font-weight:700}
.hold{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.hold a{display:inline-flex;align-items:center;min-height:44px;color:var(--bronze)}
.hold .w{font-family:var(--mono);font-size:12px}
.keyrow{display:flex;align-items:center;gap:14px}
.keyrow .sw{width:44px;flex:0 0 auto;display:flex;justify-content:center}
.keyrow .kt{font-size:13px;line-height:1.45;color:var(--ink-muted)}

@media (max-width: 960px){
  .spread{grid-template-columns:1fr;box-shadow:none}
  .single-wrap{width:100%;max-width:440px}
  h1{font-size:28px}
}
@media (prefers-reduced-motion: no-preference){
  .pagefade{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.4}to{opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="brand" href="#top">The Unlisted Brief</a><a class="back" href="#articles">← All articles</a></div>
  <main id="app" aria-live="off"></main>
</div>
<footer>The Unlisted Brief</footer>

<script>
// ---- Minimal stand-in for the design canvas runtime, so the template's own logic runs unchanged ----
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = null; this.onChange = null; }
  setState(patch) { this.state = Object.assign({}, this.state || {}, patch); if (this.onChange) this.onChange(); }
}
class Component extends DCLogic {

  // ---- Data: read from the chain by loader.mjs (Stage 3B), or the archived snapshot (D32). ----
  assets() { return window.__PASSPORT_DATA; }
  txHref(tx) { return tx ? window.__PASSPORT_EXPLORER + '/tx/' + tx : '#'; }
  addrHref(addr) { return addr ? window.__PASSPORT_EXPLORER + '/address/' + addr : '#'; }
  walletHref(w) { return this.addrHref(w.address); }

  // ---- Entry kinds. Only scheduled visits and commissioning are stamps; everything else is a log row. ----
  kinds() {
    return {
      commission: { label: 'COMMISSIONED', ink: '#0F1E38', stamp: true, w: '150px', border: '6px double #0F1E38' },
      sched:      { label: 'SCHEDULED VISIT', ink: '#3B4A6B', stamp: true, w: '132px', border: '2px solid #3B4A6B' },
      intervention: { label: 'REVAMPING / REPOWERING', ink: '#0F1E38' },
      unsched:    { label: 'UNSCHEDULED WORK', ink: '#7A5A40' },
      replace:    { label: 'EQUIPMENT REPLACED', ink: '#0F1E38' },
      claim:      { label: 'WARRANTY CLAIM', ink: '#5B3A29' },
      dispute:    { label: 'WARRANTY DISPUTE', ink: '#5B3A29' },
      weather:    { label: 'SEVERE WEATHER', ink: '#3B4A6B' },
      insclaim:   { label: 'INSURANCE CLAIM', ink: '#5B3A29' },
      pending:    { label: 'AWAITING CONFIRMATION', ink: '#4A5568' },
      provider:   { label: 'O&M PROVIDER CHANGED', ink: '#4A5568' },
      contract:   { label: 'CONTRACT CHANGE', ink: '#3B4A6B' },
      transfer:   { label: 'CONTROL TRANSFERRED', ink: '#0F1E38' }
    };
  }

  keyItems() {
    return [
      { isBox: true, isNote: false, isLink: false, w: '30px', h: '30px', border: '5px double #0F1E38', radius: '50%', text: 'Double-ring seal: commissioning, original or after a major intervention' },
      { isBox: true, isNote: false, isLink: false, w: '26px', h: '26px', border: '2px solid #3B4A6B', radius: '50%', text: 'Round stamp: scheduled visit' },
      { isBox: false, isNote: true, isLink: false, text: 'Recorded date in bronze: recorded two or more months after the event' },
      { isBox: false, isNote: false, isLink: true, text: 'Items marked ↗ (every stamp, entry and wallet) open their record on the explorer' },
      { isBox: false, isNote: false, isLink: false, text: 'Maintenance pages list entries by the year they were recorded; the event date is shown on each entry.' },
      { isBox: false, isNote: false, isLink: false, text: 'Recorded on the network: everything except a few details, which are illustrative in this demo: on the data page, COD, developer, grid connection, DC capacity and ratio, energization, typology and orientation; and the modules’ performance warranty.' },
      { isBox: false, isNote: false, isLink: false, text: 'Holder: the wallet that controls this record. It is not an ownership interest in the asset.' }
    ];
  }

  // ---- Dates ----
  mon(s) {
    var M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var p = s.split('-');
    return M[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  monthsBetween(a, b) {
    var x = a.split('-'), y = b.split('-');
    return (parseInt(y[0], 10) * 12 + parseInt(y[1], 10)) - (parseInt(x[0], 10) * 12 + parseInt(x[1], 10));
  }
  yearOf(s) { return parseInt(s.slice(0, 4), 10); }

  notesFor(e) {
    var notes = [];
    if (e.note) notes.push({ text: e.note });
    // Late recording is shown by the bronze "Recorded …" date in the row, not by a separate note.
    return notes;
  }
  byLine(e) { return e.by + (e.status ? ' · ' + e.status : ''); }
  ariaFor(e, label) {
    var name = label.charAt(0) + label.slice(1).toLowerCase();
    return name + '. Event ' + this.mon(e.event) + ', recorded ' + this.mon(e.recorded) + '. ' + e.text + '. ' +
      (e.equip ? 'Equipment: ' + e.equip + '. ' : '') + this.byLine(e) + '. View the transaction on the explorer.';
  }
  stampView(e, i) {
    var K = this.kinds()[e.kind];
    var rots = ['-3deg', '2deg', '-1.5deg', '2.5deg'];
    return { label: K.label, w: K.w, h: K.w, border: K.border, ink: K.ink, rot: rots[i % rots.length],
      date: this.mon(e.event).toUpperCase(), text: e.text, by: this.byLine(e), notes: this.notesFor(e),
      href: this.txHref(e.tx), aria: this.ariaFor(e, K.label) };
  }
  // Corrective work is shown by system only (e.g. "Corrective – Cabling"), not by detailed location.
  sysOf(eq, sys) {
    if (sys) return sys.toUpperCase();
    var map = { 'CABLE SECTION C': 'Cabling', 'INVERTER 2': 'Inverters', 'TRACKERS': 'Trackers' };
    return (map[eq] || eq || 'General').toUpperCase();
  }
  rowView(e) {
    var K = this.kinds()[e.kind];
    var late = this.monthsBetween(e.event, e.recorded) > 1;
    return { href: this.txHref(e.tx), date: this.mon(e.event).toUpperCase(), rec: 'Recorded ' + this.mon(e.recorded),
      recInk: late ? '#7A5A40' : '#4A5568', type: e.kind === 'unsched' ? 'CORRECTIVE – ' + this.sysOf(e.equip, e.system) : (e.kind === 'replace' ? 'REPLACEMENT – ' + this.sysOf(e.equip, e.system) : ((e.kind === 'claim' || e.kind === 'dispute') && e.equip ? K.label + ' – ' + this.sysOf(e.equip, e.system) : (e.category ? e.category + ' · ' + K.label : K.label))), ink: K.ink, text: e.kind === 'unsched' ? '' : e.text,
      hasText: e.kind !== 'unsched' && !!e.text, equip: e.equip, hasEquip: ['unsched', 'replace', 'pending', 'claim', 'dispute'].indexOf(e.kind) === -1 && !!e.equip, before1: e.before ? 'Before: ' + e.before[0] : '', before2: e.before ? e.before[1] : '', hasBefore: !!e.before, by: this.byLine(e), notes: this.notesFor(e), aria: this.ariaFor(e, K.label) + (e.before ? ' Before: ' + e.before.join(', ') + '.' : '') };
  }

  // Summary totals for a component page: unit count, total rating, manufacturers.
  summaryFor(c) {
    var n = 0, numeric = true, makers = [];
    c.units.forEach(function (un) {
      if (makers.indexOf(un.manufacturer) === -1) makers.push(un.manufacturer);
      if (un.part) return; // sub-assemblies (e.g. tracker drives) are not counted as separate units
      if (typeof un.qty === 'number') n += un.qty; else numeric = false;
    });
    return [
      { label: 'UNITS', value: numeric ? n.toLocaleString('en-US') : '[count]' },
      { label: 'TOTAL', value: c.total }
    ];
  }

  // ---- Pagination ----
  buildPages(a) {
    var self = this;
    var LINED = 'repeating-linear-gradient(0deg, transparent 0 27px, rgba(15,30,56,0.045) 27px 28px)';
    var byEvent = function (x, y) { return x.event < y.event ? -1 : (x.event > y.event ? 1 : (x.recorded < y.recorded ? -1 : 1)); };
    var byRecorded = function (x, y) { return x.recorded !== y.recorded ? (x.recorded < y.recorded ? -1 : 1) : byEvent(x, y); };
    var ents = a.entries.slice().sort(byEvent);
    var of = function (kinds) { return ents.filter(function (en) { return kinds.indexOf(en.kind) !== -1; }); };

    var inner = [];
    // One sheet, split onto continuation pages when the log is long.
    function sheet(section, tab, o) {
      var groups = o.groups || [], stamps = o.stamps || [], log = o.log || [];
      var groupRows = 0; groups.forEach(function (g) { groupRows += g.rows.length + 1; });
      var cap = Math.max(2, (stamps.length ? 3 : 6) - Math.ceil(groupRows / 3));
      var chunks = [];
      for (var i = 0; i < log.length; i += cap) chunks.push(log.slice(i, i + cap));
      if (!chunks.length) chunks.push([]);
      chunks.forEach(function (c, ci) {
        var first = ci === 0;

      (p.groups || []).forEach(function (g) {

          return '<div class="row"><div class="top">' + (r.href ? '<a class="wl" href="' + esc(r.href) + '" aria-label="Wallet ' + esc(r.name) + ': view its transactions on the explorer">' + esc(r.name) + '<span class="ext" aria-hidden="true">↗</span></a>' : '<span>' + esc(r.name) + '</span>') + '<span class="v">' + esc(r.value || '') + '</span></div>' +
            (r.hasSub ? '<span class="s">' + esc(r.sub) + '</span>' : '') + (r.hasSub2 ? '<span class="s">' + esc(r.sub2) + '</span>' : '') + '</div>';
        }).join('') + '</div>';
      });
      if (p.hasStamps) inner += '<div class="stamps">' + p.stamps.map(function (s) {
        return '<div class="stampcell"><a class="stamp" href="' + esc(s.href) + '" aria-label="' + esc(s.aria) + '" style="width:' + s.w + ';border:' + s.border + ';color:' + s.ink + ';transform:rotate(' + s.rot + ')">' +
          '<span class="l">' + esc(s.label) + '</span><span class="d">' + esc(s.date) + '<span class="ext" aria-hidden="true">↗</span></span><span class="x">' + esc(s.text) + '</span><span class="b">' + esc(s.by) + '</span></a>' +
          s.notes.map(function (n) { return '<span class="note" style="max-width:200px;text-align:center">' + esc(n.text) + '</span>'; }).join('') + '</div>';
      }).join('') + '</div>';
      if (p.hasNotice) inner += '<div class="notice">' + esc(p.notice) + '</div>';
      if (p.hasLog) inner += '<div><div class="gt">' + esc(p.logTitle) + '</div>' + p.log.map(function (r) {
        return '<a class="logrow" href="' + esc(r.href) + '" aria-label="' + esc(r.aria) + '"><div><div class="dt">' + esc(r.date) + '<span class="ext" aria-hidden="true">↗</span></div><div class="rc" style="color:' + r.recInk + '">' + esc(r.rec) + '</div></div>' +
          '<div class="body"><span class="ty" style="color:' + r.ink + '">' + esc(r.type) + '</span>' +
          (r.hasText ? '<span class="tx">' + esc(r.text) + '</span>' : '') +
          (r.hasEquip ? '<span class="eq">' + esc(r.equip) + '</span>' : '') +
          (r.hasBefore ? '<span class="bf">' + esc(r.before1) + '</span><span class="bf">' + esc(r.before2) + '</span>' : '') +
          '<span class="by">' + esc(r.by) + '</span>' +
          r.notes.map(function (n) { return '<span class="note">' + esc(n.text) + '</span>'; }).join('') + '</div></a>';
      }).join('') + '</div>';
      if (p.isEmpty) inner += '<div class="empty">' + esc(p.emptyText) + '</div>';
      inner += mrz(p);
      h = frame(p, p.bgImage && p.bgImage !== 'none' ? 'lined' : '', inner);
    }
    return '<div class="pg">' + h + '</div>';
  }

  // ---------- whole page ----------
  // "Go to section": the sections in order, with Maintenance listed by year.
  var jumpItems = [], jumpChoice = null;   // the visitor's last choice, kept while it is on screen
  function jumpMenu(tabs, years) {
    jumpItems = [];
    var on = function (t) { return t.current === 'page'; };   // entries mark the current page with the text 'page'
    var inYears = years.some(on);
    tabs.forEach(function (t) {
      if (t.label === 'Maintenance' && years.length) years.forEach(function (y) { jumpItems.push({ label: 'Maintenance ' + y.label, go: y.go, current: on(y) }); });
      else jumpItems.push({ label: t.label, go: t.go, current: on(t) });
    });
    var chosen = jumpItems.findIndex(function (it) { return it.current && it.label === jumpChoice; });
    var sel = chosen >= 0 ? chosen : Math.max(0, jumpItems.findIndex(function (it) { return it.current; }));   // else the first current (a spread can show two)
    var opts = jumpItems.map(function (it, i) { return '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + esc(it.label) + '</option>'; }).join('');
    return '<div class="jump"><label for="jump">Go to section</label><select id="jump">' + opts + '</select></div>';
  }
  function chips(list, cls) {
    return list.map(function (t, i) { return '<button type="button" class="' + cls + '" data-i="' + i + '" aria-current="' + t.current + '">' + esc(t.label) + '</button>'; }).join('');
  }
  function render() {
    var v = comp.renderVals();
    var single = mq.matches;
    var a = v.a;
    var html = '';
    html += '<div class="disclosure">Demonstration on Polygon Amoy, a public test network where nothing has monetary value. The location is real; the farms, companies, people and events are fictional. Recorded dates are simulated: five years of history were recorded in one day, and the explorer shows when each entry was actually written. A few details are illustrative and not recorded on the network; the key explains which.</div>';
    if (v.archived) html += '<div class="archived">Showing the archived copy of the record' + (window.__PASSPORT_SNAPSHOT_DATE ? ', made on ' + esc(window.__PASSPORT_SNAPSHOT_DATE) : '') + '. The live network is unavailable right now.</div>';
    html += '<div class="head"><div class="eyebrow">ASSET PASSPORT · ' + esc(a.assetNo) + ' · DEMO</div><h1>' + esc(a.name) + '</h1>' +
      '<div class="meta"><span class="src"><span class="dot" style="background:' + v.sourceDot + '"></span><span>' + esc(v.sourceLabel) + '</span></span>' +
      '<span>Other passports in this demo: ' + Object.keys(comp.assets()).filter(function (k) { return k !== a.assetNo; }).map(function (k) {
        return '<button type="button" class="linkbtn" data-asset="' + k + '">' + esc(comp.assets()[k].name) + '</button>';
      }).join(' ') + '</span></div></div>';

    html += '<section class="booklet" tabindex="0" aria-label="' + esc(v.bookletLabel) + '">';
    if (!single) {
      var c = v.cur;
      html += c.isSingle
        ? '<div class="single-wrap pagefade">' + renderPage(c.page) + '</div>'
        : '<div class="spread pagefade">' + renderPage(c.left) + renderPage(c.right) + '</div>';
      html += '<div class="navrow"><button type="button" class="btn prev" data-nav="prev"' + (v.spreadPrevOff ? ' disabled' : '') + '>‹ Previous</button>' +
        '<span class="status" aria-live="polite">' + esc(v.spreadStatus) + '</span>' +
        '<button type="button" class="btn next" data-nav="next"' + (v.spreadNextOff ? ' disabled' : '') + '>' + esc(v.spreadNextLabel) + ' ›</button></div>';
      html += jumpMenu(v.spreadTabs, v.spreadYears);
    } else {
      html += '<div class="single-wrap pagefade">' + renderPage(v.single) + '</div>';
      html += '<div class="navrow" style="max-width:440px;justify-content:space-between"><button type="button" class="btn prev" data-nav="prev" aria-label="Previous page"' + (v.singlePrevOff ? ' disabled' : '') + '>‹</button>' +
        '<span class="status" aria-live="polite">' + esc(v.singleStatus) + '</span>' +
        '<button type="button" class="btn next" data-nav="next"' + (v.singleNextOff ? ' disabled' : '') + '>' + esc(v.singleNextLabel) + ' ›</button></div>';
      html += jumpMenu(v.singleTabs, v.singleYears);
    }
    html += '</section>';

    html += '<div class="cta"><a class="primary" href="mailto:support@ontoken.cloud?subject=Asset%20passport%20pilot&amp;body=Name%3A%0ARole%20(owner%2C%20asset%20manager%2C%20O%26M%20provider%2C%20other)%3A%0AAsset%20type%20and%20size%20(optional)%3A">I am interested in running a pilot with a real asset, no commitments</a>' +
      '<p class="small">This opens an email to OnToken, LLC, which receives your details. See the <a href="https://ontoken.cloud">privacy policy on ontoken.cloud</a>.</p></div>';
    html += '<div class="closing"><p>This is a learning project and demonstration. It is not a product, service, offering, investment or security token, and it has not been audited. It runs on a public test network where nothing has monetary value; that network may be retired, so a full copy of the record is kept in the <a href="https://github.com/omarzanotellius-art/asset-passport-contract" target="_blank" rel="noopener">public repository</a>.</p>' +
      '<p>In this demo, everything is public, because the data is fictional. In real use, the owner would choose, entry by entry, which wording is public; everything else would stay as a fingerprint, readable in full only by people the owner authorizes. Anything published on a blockchain is permanent and cannot be removed.</p>' +
      '<p>© 2026 OnToken, LLC.</p></div>';

    var hadFocus = document.activeElement && document.activeElement.closest && document.activeElement.closest('.booklet');
    var focusSel = hadFocus ? (document.activeElement.getAttribute('data-nav') ? '[data-nav="' + document.activeElement.getAttribute('data-nav') + '"]' : '.booklet') : null;
    app.innerHTML = html;
    document.title = a.name + ' · Asset passport';

    // wire controls
    var tabs = single ? v.singleTabs : v.spreadTabs, years = single ? v.singleYears : v.spreadYears;
    var jump = app.querySelector('#jump');
    if (jump) jump.onchange = function () { var it = jumpItems[+jump.value]; if (it) { jumpChoice = it.label; it.go(); } };
    app.querySelectorAll('.year').forEach(function (b) { b.onclick = function () { years[+b.dataset.i].go(); }; });
    app.querySelectorAll('[data-nav]').forEach(function (b) {
      b.onclick = function () { (b.dataset.nav === 'prev' ? (single ? v.singlePrev : v.spreadPrev) : (single ? v.singleNext : v.spreadNext))(); };
    });
    app.querySelectorAll('[data-asset]').forEach(function (b) {
      b.onclick = function () { comp.props.asset = b.dataset.asset; comp.state = { idx: 0 }; history.replaceState(null, '', '?asset=' + b.dataset.asset); render(); window.scrollTo(0, 0); };
    });
    app.querySelectorAll('a[href*="/tx/"], a[href*="/address/"]').forEach(function (l) { l.target = '_blank'; l.rel = 'noopener'; });
    var bk = app.querySelector('.booklet');
    bk.onkeydown = function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      if (e.key === 'ArrowRight') (single ? v.singleNext : v.spreadNext)(); else (single ? v.singlePrev : v.spreadPrev)();
    };
    if (focusSel) { var f = app.querySelector(focusSel); if (f && !f.disabled) f.focus({ preventScroll: true }); else bk.focus({ preventScroll: true }); }
  }

  comp.onChange = render;
  mq.addEventListener('change', render);
  // V2: sections in the address, e.g. ?asset=AP-0002#maintenance-2024
  function slug(p) {
    if (!p.section) return '';
    var y = p.section === 'maintenance' && /(\d{4})/.exec(p.title || '');
    return p.section + (y ? '-' + y[1] : '');
  }
  function goToHash() {
    var h = decodeURIComponent((location.hash || '').replace('#', '')).toLowerCase();
    if (!h) return;
    var pages = comp.buildPages(comp.assets()[comp.props.asset]).pages;
    var i = pages.findIndex(function (p) { return slug(p) === h; });
    if (i >= 0) { comp.state = { idx: i }; render(); }
  }
  window.addEventListener('hashchange', goToHash);
  render();
  goToHash();
};
</script>
<script type="module">
import { createPublicClient, http, fallback } from "./lib/viem-2.56.8.js";
import { loadPassports } from "./loader.mjs";
const LIMIT_MS = 12000;                                      // V4
const app = document.getElementById('app');
app.innerHTML = '<p style="max-width:640px;margin:80px auto;text-align:center;font-family:var(--sans,sans-serif);color:#4A5568">Reading the passport from the network…</p>';
const getJson = async (f) => { const r = await fetch('./data/' + f, { cache: 'no-cache' }); if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); };
const cfg = await getJson('config.json');
window.__PASSPORT_EXPLORER = cfg.explorer;
window.__PASSPORT_NETWORK_NAME = cfg.networkName;
let data = null;
try {
  const [abi, overlay, illustrative] = await Promise.all([getJson('abi.json'), getJson('overlay.json'), getJson('illustrative.json')]);
  const chain = { id: cfg.chainId, name: cfg.networkName, nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 }, rpcUrls: { default: { http: cfg.rpc } } };
  const client = createPublicClient({ chain, transport: fallback(cfg.rpc.map((u) => http(u, { timeout: LIMIT_MS }))) });
  data = await Promise.race([
    loadPassports({ client, contract: cfg.contract, abi, fromBlock: BigInt(cfg.fromBlock), toBlock: BigInt(cfg.toBlock), overlay, illustrative, networkLabel: cfg.mrzNetwork }),
    new Promise((_, no) => setTimeout(() => no(new Error('time limit')), LIMIT_MS)),
  ]);
} catch (err) {
  console.warn('Live read failed, using the archived copy:', err && err.message);
  try {
    const snap = await getJson('snapshot.json');
    data = snap.passports; window.__PASSPORT_ARCHIVED = true;
    window.__PASSPORT_SNAPSHOT_DATE = new Date(snap.madeAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  } catch (e2) { data = null; }
}
if (!data) {
  app.innerHTML = '<p style="max-width:640px;margin:80px auto;text-align:center;color:#4A5568">The passport could not be read from the network right now, and no archived copy is available. Please try again later.</p>';
} else {
  window.__PASSPORT_DATA = data;
  window.__startPassport();
}
</script>
